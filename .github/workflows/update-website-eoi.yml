name: Update website EOI CSV

on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-website-eoi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run: |
          install.packages(c(
            "tidyverse",
            "httr",
            "openxlsx"
          ))
        shell: Rscript {0}

      - name: Pull REDCap report and create website CSV
        env:
          REDCAP_API_URL: ${{ secrets.REDCAP_API_URL }}
          REDCAP_API_TOKEN: ${{ secrets.REDCAP_API_TOKEN }}
          REDCAP_REPORT_ID: ${{ secrets.REDCAP_REPORT_ID }}
        run: |
          source("R/update_website_eoi.R")
        shell: Rscript {0}

      - name: Commit updated CSV
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/public/eoi_data.csv
          git diff --cached --quiet || git commit -m "Update website EOI CSV"
          git push
